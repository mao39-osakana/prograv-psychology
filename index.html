<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>心理学教材（小説フック＋フリック）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#101c31;
    --navy-2:#1b2c4a;
    --ink:#101c31;
    --sub:#5b6779;
    --line:#d7dde8;
    --bg:#ffffff;
    --page:#f3f5f8;
    --card:#ffffff;
    --tint:#eef1f6;
    --accent-a:#f6c945;
    --accent-b:#ef8a1a;
    --orange:#b96a12;
    --ok:#1a7a4a;
    --ok-bg:#eaf6ef;
    --ng:#b42318;
    --ng-bg:#fdf0ef;
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#eef1f7;
      --sub:#a9b4c6;
      --line:#2c3a55;
      --bg:#0d1524;
      --page:#0d1524;
      --card:#141f35;
      --tint:#1a2947;
      --orange:#f0a04b;
      --ok:#5ec98d;
      --ok-bg:#143527;
      --ng:#ff9a92;
      --ng-bg:#3d1f1d;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;touch-action:manipulation}
  body{
    font-family:"Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
    background:var(--page);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;min-height:44px;cursor:pointer;touch-action:manipulation}
  .wrap{max-width:560px;margin:0 auto;padding:18px 16px 28px}
  [hidden]{display:none !important}

  /* ===== hub ===== */
  .hub-kicker{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--orange);margin:4px 2px 8px}
  .hub-title{font-size:30px;font-weight:900;line-height:1.3;margin:0 2px 6px}
  .hub-sub{font-size:13px;color:var(--ink);line-height:1.7;margin:0 2px 18px}
  .hub-summary{
    background:var(--card);border:2px solid var(--navy);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:16px;
  }
  @media (prefers-color-scheme: dark){.hub-summary{border-color:#3a4d75}}
  .hub-summary .s-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
  .hub-summary .s-label{font-size:13px;font-weight:700;color:var(--sub)}
  .hub-summary .s-count{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
  .hub-summary .s-count span{color:var(--sub);font-weight:500;font-size:13px}
  .hub-list{display:flex;flex-direction:column;gap:12px}
  .hub-item{
    display:block;width:100%;text-align:left;background:var(--card);
    border:2px solid var(--navy);border-radius:var(--radius);
    padding:18px 18px 16px;color:var(--ink);
    box-shadow:0 6px 18px rgba(16,28,49,.07);
  }
  @media (prefers-color-scheme: dark){.hub-item{border-color:#3a4d75;box-shadow:none}}
  .hub-item:active{transform:scale(.995)}
  .hub-item .i-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .hub-item .i-no{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--orange)}
  .hub-item .i-badge{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
  .hub-item .i-badge.read{color:var(--ok);background:var(--ok-bg)}
  .hub-item .i-badge.unread{color:var(--sub);background:var(--tint)}
  .hub-item .i-theme{font-size:22px;font-weight:900;line-height:1.4;margin:0 0 6px}
  .hub-item .i-story{font-size:14px;font-weight:500;line-height:1.6;color:var(--ink)}
  .hub-item .i-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:12px;color:var(--sub)}
  .hub-item .i-open{font-weight:700;color:var(--orange);white-space:nowrap}
  .hub-note{font-size:12px;color:var(--sub);line-height:1.7;margin:16px 2px 0}

  /* back link */
  .back-link{
    display:inline-flex;align-items:center;gap:4px;background:none;border:none;padding:6px 2px;
    font-size:14px;font-weight:700;color:var(--ink);min-height:36px;margin-bottom:6px;
  }
  .back-link:active{opacity:.6}

  /* progress */
  .progress-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:2px 2px 8px}
  .progress-head .p-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--sub)}
  .progress-head .p-count{font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
  .progress-head .p-count span{color:var(--sub);font-weight:500}
  .bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar-fill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent-a),var(--accent-b));transition:width .35s ease}
  @media (prefers-reduced-motion: reduce){.bar-fill{transition:none}}

  /* card */
  .deck{margin-top:14px;position:relative}
  .card{
    background:var(--card);
    border:2px solid var(--navy);
    border-radius:var(--radius);
    padding:26px 24px 24px;
    /* 進捗表示＋カード＋前へ/次へボタンがスクロールなしで画面に収まる高さ。
       上下の固定要素（戻るリンク・進捗・ナビ等）の合計は約230px＋余裕分 */
    height:600px;
    height:min(600px, calc(100vh - 288px));
    height:min(600px, calc(100dvh - 288px));
    /* カード内スクロールはしない。本文は表示領域に収まる分量で分割する */
    overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 10px 28px rgba(16,28,49,.10);
    /* pan-y は manipulation より制限が強い値で、横フリックの判定を
       ブラウザに奪われないよう従来どおり維持する。
       ダブルタップズームは auto 以外の値すべてで無効になる */
    touch-action:pan-y;
    user-select:none;
    -webkit-user-select:none;
  }
  @media (prefers-color-scheme: dark){.card{border-color:#3a4d75;box-shadow:none}}
  .card.anim-next{animation:slideNext .28s ease}
  .card.anim-prev{animation:slidePrev .28s ease}
  @keyframes slideNext{from{opacity:.25;transform:translateX(22px)}to{opacity:1;transform:none}}
  @keyframes slidePrev{from{opacity:.25;transform:translateX(-22px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.card.anim-next,.card.anim-prev{animation:none}}

  .kicker{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .kicker .tag{font-size:12px;font-weight:900;letter-spacing:.06em;color:var(--orange)}
  .kicker .sub-tag{font-size:12px;font-weight:500;color:var(--sub)}
  .kicker .done-badge{font-size:11px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:99px;padding:3px 9px}

  /* title card */
  .t-no{font-size:13px;font-weight:900;letter-spacing:.14em;color:var(--orange);margin:6px 0 10px}
  .t-title{font-size:38px;line-height:1.25;font-weight:900;letter-spacing:.01em;margin:0}
  .t-underline{width:120px;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--accent-a),var(--accent-b));margin:16px 0 22px}
  .story-box{background:var(--tint);border-radius:12px;padding:16px 18px}
  .story-box .s-label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--sub);margin-bottom:6px}
  .story-box .s-title{font-size:19px;font-weight:700;line-height:1.5}
  .story-box .s-author{font-size:13px;color:var(--sub);margin-top:6px}
  .flow{margin:20px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .flow li{display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.6}
  .flow .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
  @media (prefers-color-scheme: dark){.flow .n{background:#eef1f7;color:#101c31}}
  .flow b{font-weight:700}
  .flow span{color:var(--sub)}
  .tap-hint{margin-top:auto;padding-top:22px;font-size:12px;color:var(--sub);text-align:center}

  /* story / expl body */
  .body-text{font-size:17px;line-height:2.05;font-weight:400;letter-spacing:.01em;word-break:break-word}
  .body-text.small{font-size:16px;line-height:1.95}
  .body-text p{margin:0 0 .9em}
  .body-text p:last-child{margin-bottom:0}
  .card-foot{margin-top:auto;padding-top:20px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub)}
  .card-foot .dots{margin-left:auto}
  .dots{display:flex;gap:5px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);display:block}
  .dots i.on{background:var(--accent-b)}

  .expl-head{font-size:22px;font-weight:900;line-height:1.5;margin:0 0 14px}
  .expl-head em{font-style:normal;background:linear-gradient(transparent 62%, rgba(246,201,69,.55) 62%)}
  @media (prefers-color-scheme: dark){.expl-head em{background:linear-gradient(transparent 62%, rgba(239,138,26,.45) 62%)}}

  /* quiz */
  .q-text{font-size:18px;font-weight:700;line-height:1.65;margin:0 0 14px}
  .options{display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
    background:var(--card);border:2px solid var(--line);border-radius:12px;
    padding:12px 14px;font-size:14.5px;line-height:1.6;color:var(--ink);font-weight:500;
    min-height:56px;
  }
  .opt .num{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--navy);color:var(--navy);font-weight:900;font-size:14px;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
  @media (prefers-color-scheme: dark){.opt .num{border-color:#8fa3c8;color:#dbe4f5}}
  .opt:active{transform:scale(.99)}
  .opt.correct{border-color:var(--ok);background:var(--ok-bg)}
  .opt.correct .num{border-color:var(--ok);background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--ng);background:var(--ng-bg)}
  .opt.wrong .num{border-color:var(--ng);background:var(--ng);color:#fff}
  .opt.dim{opacity:.55}
  .opt:disabled{cursor:default}
  .quiz-result{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.75;display:none}
  .quiz-result.show{display:block}
  .quiz-result.ok{background:var(--ok-bg);border:1.5px solid var(--ok)}
  .quiz-result.ng{background:var(--ng-bg);border:1.5px solid var(--ng)}
  .quiz-result .r-head{font-weight:900;margin-bottom:4px}
  .quiz-result.ok .r-head{color:var(--ok)}
  .quiz-result.ng .r-head{color:var(--ng)}

  /* done card */
  .done-wrap{text-align:center;margin:auto 0}
  .done-check{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,var(--accent-a),var(--accent-b));display:flex;align-items:center;justify-content:center}
  .done-check svg{width:32px;height:32px}
  .done-title{font-size:24px;font-weight:900;line-height:1.5;margin:0 0 8px}
  .done-sub{font-size:14px;color:var(--sub);line-height:1.8;margin:0}

  /* nav */
  .nav{display:flex;gap:10px;margin-top:14px}
  .btn{
    border-radius:12px;font-size:15px;font-weight:700;padding:12px 18px;
    border:2px solid var(--navy);background:var(--card);color:var(--ink);
    min-height:52px;
  }
  @media (prefers-color-scheme: dark){.btn{border-color:#3a4d75}}
  .btn-prev{flex:0 0 108px}
  .btn-next{flex:1;background:var(--navy);color:#fff;border-color:var(--navy)}
  @media (prefers-color-scheme: dark){.btn-next{background:#eef1f7;color:#101c31;border-color:#eef1f7}}
  .btn:disabled{opacity:.35;cursor:default}
  .btn-restart{width:100%;background:var(--navy);color:#fff;border-color:var(--navy);margin-top:22px}
  @media (prefers-color-scheme: dark){.btn-restart{background:#eef1f7;color:#101c31;border-color:#eef1f7}}
  .btn-tolist{width:100%;margin-top:10px}
  .nav-hint{text-align:center;font-size:12px;color:var(--sub);margin-top:10px}
  @media (max-width:420px){
    .card{padding:22px 19px 20px}
    .t-title{font-size:33px}
    .body-text{font-size:16.5px}
    .hub-title{font-size:27px}
  }
  /* クイズ回答後は選択肢と結果表示を少し詰め、フッターの案内文を畳んで
     結果まで含めてカード内に収める */
  .card.quiz-answered .options{gap:8px}
  .card.quiz-answered .opt{padding:10px 12px}
  .card.quiz-answered .quiz-result{margin-top:10px;padding:10px 12px;font-size:13px;line-height:1.7}
  .card.quiz-answered .card-foot{display:none}
  @media (max-height:880px){
    .card.quiz-answered .kicker{margin-bottom:10px}
    .card.quiz-answered .q-text{margin-bottom:8px}
    .card.quiz-answered .opt{line-height:1.5}
    .card.quiz-answered .quiz-result{line-height:1.6}
  }

  /* 背の低い画面では外側の余白を詰めてカードを少し高くし、
     タイトルカードの中身も詰めて、スクロールなしで収める */
  @media (max-height:760px){
    .wrap{padding-top:10px;padding-bottom:14px}
    .back-link{min-height:32px;margin-bottom:0}
    .progress-head{margin-bottom:6px}
    .deck{margin-top:10px}
    .nav{margin-top:10px}
    .nav-hint{display:none}
    .card{height:calc(100vh - 214px);height:calc(100dvh - 214px);padding-top:18px;padding-bottom:14px}
    .kicker{margin-bottom:10px}
    .t-no{margin:2px 0 6px}
    .t-underline{margin:12px 0 16px}
    .story-box{padding:13px 16px}
    .flow{margin-top:14px;gap:6px}
    .tap-hint{padding-top:14px}
  }

  /* ============ GLOBAL HEADER (KSF教材と共通) ============ */
  .g-head{position:fixed;top:0;left:0;right:0;height:48px;z-index:60;background:var(--bg);border-bottom:1px solid rgba(128,138,160,.35)}
  .g-head-in{max-width:560px;margin:0 auto;height:100%;padding:0 14px;display:flex;align-items:center;gap:10px}
  .g-logo{display:inline-flex;align-items:baseline;gap:8px;background:none;border:none;padding:6px 4px;min-height:44px;color:var(--ink);cursor:pointer;font-family:inherit}
  .g-logo .wm{font-family:'Libre Baskerville',serif;font-size:19px;font-weight:700;letter-spacing:.06em;line-height:1;padding-bottom:4px;position:relative}
  .g-logo .wm::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3.5px;border-radius:99px;background:linear-gradient(100deg,#f6c945 0%,#f59b2e 60%,#ef7f22 100%)}
  .g-logo .tag{font-size:11px;font-weight:700;color:#8a94a6;letter-spacing:.08em}
  .g-crumb{margin-left:auto;font-size:11.5px;font-weight:700;color:#8a94a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  body{padding-top:48px}
</style>

<body>
<header class="g-head">
  <div class="g-head-in">
    <button class="g-logo" id="pgHomeBtn" aria-label="一覧に戻る">
      <span class="wm">PRO-GRAV</span><span class="tag">教材</span>
    </button>
    <span class="g-crumb">小説で読む心理学</span>
  </div>
</header>

<main class="wrap">

  <!-- ===== hub view ===== -->
  <section id="hubView">
    <p class="hub-kicker">心理学インプット教材</p>
    <h1 class="hub-title">小説で読む心理学</h1>
    <p class="hub-sub">画面をフリックして物語を読み進め、解説とクイズを通して心理学を学べます。読みたい作品を選んでください。</p>

    <div class="hub-summary">
      <div class="s-row">
        <span class="s-label">進捗</span>
        <span class="s-count"><span id="hubReadCount">0</span>件読了 <span>／ 全 <span id="hubTotalCount">6</span> 件</span></span>
      </div>
      <div class="bar" role="progressbar" aria-label="全体の進捗" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" id="hubBarWrap">
        <div class="bar-fill" id="hubBarFill"></div>
      </div>
    </div>

    <div class="hub-list" id="hubList"></div>
    <p class="hub-note">読了の状態は、この端末に保存されます。</p>
  </section>

  <!-- ===== deck view ===== -->
  <section id="deckView" hidden>
    <button class="back-link" id="backBtn" type="button">‹ 一覧に戻る</button>
    <div class="progress-head" aria-live="polite">
      <div class="p-label" id="phaseLabel">タイトル</div>
      <div class="p-count"><span id="curNum">1</span> / <span id="totalNum">12</span> <span>枚</span></div>
    </div>
    <div class="bar" role="progressbar" aria-label="進捗" aria-valuemin="1" aria-valuemax="12" aria-valuenow="1" id="barWrap">
      <div class="bar-fill" id="barFill"></div>
    </div>

    <div class="deck">
      <article class="card" id="card" aria-live="polite"></article>
    </div>

    <div class="nav" id="navRow">
      <button class="btn btn-prev" id="prevBtn" type="button">← 前へ</button>
      <button class="btn btn-next" id="nextBtn" type="button">次へ →</button>
    </div>
    <p class="nav-hint">カードをタップ、または左右にスワイプでもめくれます</p>
  </section>
</main>

<script>
(function(){

  var ITEMS = [
    {
      id: "no1",
      no: "No.1",
      theme: "ハロー効果",
      storyTitle: "『地図の読めない彼女』",
      readKey: "prograv_psy_no1_read",
      readAtKey: "prograv_psy_no1_read_at",
      expl2Head: "使い方 ― 本人に聞いてみる",
      story: [
        "会議で話が止まると、美咲が資料を一枚戻した。\n\n「今決めるのは、こちらで進めるかどうかですよね。細かい修正は、決まってからでも間に合います」\n\n亮介が十分かけてもまとめられなかった話が、それで先へ進んだ。\n\n美咲と二人で食事をするようになってからも、亮介はどこかで仕事中の彼女を見ていた。店を予約するときには、駅からの距離だけでなく、席の広さや照明の写真まで調べた。自分が普段通っている定食屋は、一度も候補に入れなかった。\n\n彼女なら、もっといい店を知っているだろう。",

  /* カード内スクロールを出さないための分割上限。
     幅375px・高さ667px級の小さな画面でも本文が全て見えるよう、
     実際の行数に換算して見積もる（1行あたりの文字数は実際より
     少なめに見積もり、段落間の余白も高さに含める）。
     物語：本文エリア約340px分まで／解説：約325px分まで、
     見出しのある先頭カードは約255px分まで。 */
  var STORY_SPLIT = { cpl:15, lineH:34, gap:15, budget:335 };
  var EXPL_SPLIT  = { cpl:16, lineH:32, gap:15, budget:325, firstBudget:255 };

  function splitSentences(p){
    var out = [];
    var rest = p;
    while (rest.length){
      var m = rest.match(/^[^。]*。/);
      if (!m){ out.push(rest); break; }
      out.push(m[0]);
      rest = rest.slice(m[0].length);
    }
    return out;
  }

  /* テキストの描画高さ(px)の見積もり */
  function estHeight(text, o){
    var paras = text.split("\n\n");
    var h = 0;
    paras.forEach(function(p, i){
      h += Math.max(1, Math.ceil(p.length / o.cpl)) * o.lineH;
      if (i > 0) h += o.gap;
    });
    return h;
  }

  /* 1段落を、文の区切り（。）で上限内に収まるピースに分ける。
     1文だけで上限を超える場合は読点（、）で分け、それでも長い場合は
     行数換算の上限字数で切る（現在の文面では発動しない想定の保険）。 */
  function paraPieces(p, o){
    var limit = o.firstBudget || o.budget;
    if (estHeight(p, o) <= limit) return [p];
    var pieces = [];
    var cur = "";
    function pushCur(){ if (cur){ pieces.push(cur); cur = ""; } }
    splitSentences(p).forEach(function(s){
      if (estHeight(s, o) > limit){
        pushCur();
        var cCur = "";
        s.split(/(?<=、)/).forEach(function(cl){
          var maxChars = o.cpl * Math.max(1, Math.floor(limit / o.lineH));
          while (cl.length > maxChars){
            if (cCur){ pieces.push(cCur); cCur = ""; }
            pieces.push(cl.slice(0, maxChars));
            cl = cl.slice(maxChars);
          }
          if (cCur && estHeight(cCur + cl, o) > limit){ pieces.push(cCur); cCur = ""; }
          cCur += cl;
        });
        if (cCur) pieces.push(cCur);
        return;
      }
      if (cur && estHeight(cur + s, o) > limit) pushCur();
      cur += s;
    });
    pushCur();
    return pieces;
  }

  /* テキストをカード単位に分割する。物語として自然な切れ目を優先し、
     流れのつながった段落同士は同じカードにまとめる。段落の途中では
     切らず、1段落が長い場合のみ文の区切りで分ける。
     上限は描画高さの見積もりで判定し、カード内でスクロールが
     発生しない分量に収める。 */
  function chunkText(text, o){
    var paras = text.split("\n\n");
    var chunks = [];
    var cur = [];
    var budget = o.firstBudget || o.budget;
    function flush(){
      if (cur.length){ chunks.push(cur.join("\n\n")); cur = []; budget = o.budget; }
    }
    paras.forEach(function(p){
      paraPieces(p, o).forEach(function(piece){
        if (cur.length && estHeight(cur.concat([piece]).join("\n\n"), o) > budget) flush();
        cur.push(piece);
      });
    });
    flush();
    return chunks;
  }

  function buildCards(item){
    var cards = [{ type:"title", phase:"タイトル" }];
    /* 場面（シーン）の区切りが最優先の切れ目。シーンをまたいで段落を
       まとめず、各シーンの中で段落を束ねてカードにする。 */
    var storyChunks = [];
    item.story.forEach(function(scene){
      chunkText(scene, STORY_SPLIT).forEach(function(t){ storyChunks.push(t); });
    });
    item.storyCardCount = storyChunks.length;
    storyChunks.forEach(function(t, i){
      cards.push({ type:"story", phase:"物語", idx:i+1, total:storyChunks.length, text:t });
    });
    var explCards = [];
    item.expl.forEach(function(text, ei){
      var chunks = chunkText(text, EXPL_SPLIT);
      chunks.forEach(function(t, ci){
        explCards.push({
          type:"expl", phase:"解説",
          head:(ei===0?"仕組み":"使い方"),
          em:(ei===0?item.theme:""),
          first:(ci===0),
          text:t
        });
      });
    });
    item.explCardCount = explCards.length;
    explCards.forEach(function(c, i){
      c.idx = i+1; c.total = explCards.length;
      cards.push(c);
    });
    cards.push({ type:"quiz", phase:"確認クイズ" });
    cards.push({ type:"done", phase:"読了" });
    return cards;
  }
  ITEMS.forEach(function(it){ it.cards = buildCards(it); });

  function isRead(item){
    try { return localStorage.getItem(item.readKey) === "1"; } catch(e){ return false; }
  }
  function markRead(item){
    try {
      localStorage.setItem(item.readKey,"1");
      localStorage.setItem(item.readAtKey, new Date().toISOString());
    } catch(e){}
  }

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function paras(text){
    return text.split("\n\n").map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("");
  }

  function dotsHTML(total, idx){
    var h = '<span class="dots" aria-hidden="true">';
    for (var i=1;i<=total;i++){ h += '<i class="'+(i===idx?'on':'')+'"></i>'; }
    return h + '</span>';
  }

  /* ===== hub ===== */
  function renderHub(){
    var readCount = 0;
    var html = "";
    ITEMS.forEach(function(item, idx){
      var read = isRead(item);
      if (read) readCount++;
      html +=
        '<button type="button" class="hub-item" data-idx="'+idx+'">' +
          '<span class="i-top"><span class="i-no">'+esc(item.no)+'</span>' +
          '<span class="i-badge '+(read?'read':'unread')+'">'+(read?'読了':'未読')+'</span></span>' +
          '<span class="i-theme" style="display:block">'+esc(item.theme)+'</span>' +
          '<span class="i-story" style="display:block">'+esc(item.storyTitle)+'</span>' +
          '<span class="i-meta"><span>作：遊さん ・ 全'+item.cards.length+'枚</span><span class="i-open">'+(read?'もう一度読む':'読む')+' ›</span></span>' +
        '</button>';
    });
    hubList.innerHTML = html;
    hubReadCount.textContent = String(readCount);
    hubTotalCount.textContent = String(ITEMS.length);
    hubBarFill.style.width = (ITEMS.length ? (readCount / ITEMS.length * 100) : 0) + "%";
    hubBarWrap.setAttribute("aria-valuemax", String(ITEMS.length));
    hubBarWrap.setAttribute("aria-valuenow", String(readCount));

    var btns = hubList.querySelectorAll(".hub-item");
    for (var k=0;k<btns.length;k++){
      btns[k].addEventListener("click", function(){
        var idx = parseInt(this.getAttribute("data-idx"), 10);
        openDeck(ITEMS[idx]);
      });
    }
  }

  function showHub(){
    activeItem = null;
    deckView.hidden = true;
    hubView.hidden = false;
    renderHub();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function openDeck(item){
    activeItem = item;
    current = 0;
    quizAnswered = false;
    quizCorrect = false;
    quizPicked = -1;
    hubView.hidden = true;
    deckView.hidden = false;
    totalNum.textContent = String(item.cards.length);
    barWrap.setAttribute("aria-valuemax", String(item.cards.length));
    render("");
  }

  /* ===== deck ===== */
  function render(dir){
    if (!activeItem) return;
    var cards = activeItem.cards;
    var TOTAL = cards.length;
    var c = cards[current];
    var html = "";

    if (c.type === "title"){
      html =
        '<div class="kicker"><span class="tag">心理学インプット教材</span>' +
        (isRead(activeItem) ? '<span class="done-badge">読了済み</span>' : '') + '</div>' +
        '<p class="t-no">' + esc(activeItem.no) + '</p>' +
        '<h1 class="t-title">' + esc(activeItem.theme) + '</h1>' +
        '<div class="t-underline"></div>' +
        '<div class="story-box"><div class="s-label">小説</div>' +
        '<div class="s-title">' + esc(activeItem.storyTitle) + '</div>' +
        '<div class="s-author">作：遊さん</div></div>' +
        '<ul class="flow">' +
        '<li><span class="n">1</span><div><b>物語</b>　<span>全' + activeItem.storyCardCount + '枚を1枚ずつ読む</span></div></li>' +
        '<li><span class="n">2</span><div><b>解説</b>　<span>仕組みと使い方を' + activeItem.explCardCount + '枚で</span></div></li>' +
        '<li><span class="n">3</span><div><b>クイズ</b>　<span>3択1問、その場で答え合わせ</span></div></li>' +
        '</ul>' +
        '<p class="tap-hint">タップで物語が始まります</p>';
    }
    else if (c.type === "story"){
      html =
        '<div class="kicker"><span class="tag">物語</span><span class="sub-tag">' + esc(activeItem.storyTitle) + ' ' + c.idx + ' / ' + c.total + '</span></div>' +
        '<div class="body-text">' + paras(c.text) + '</div>' +
        '<div class="card-foot">' + dotsHTML(c.total, c.idx) + '</div>';
    }
    else if (c.type === "expl"){
      var secLabel = c.head + (c.first ? "" : "（つづき）");
      var headHtml = "";
      if (c.first){
        var head = c.em
          ? '仕組み ― <em>' + esc(c.em) + '</em>とは'
          : esc(activeItem.expl2Head);
        headHtml = '<h2 class="expl-head">' + head + '</h2>';
      }
      html =
        '<div class="kicker"><span class="tag">解説</span><span class="sub-tag">' + c.idx + ' / ' + c.total + ' ・ ' + esc(secLabel) + '</span></div>' +
        headHtml +
        '<div class="body-text small">' + paras(c.text) + '</div>' +
        '<div class="card-foot"><span>解説 ' + c.idx + ' / ' + c.total + '</span>' + dotsHTML(c.total, c.idx) + '</div>';
    }
    else if (c.type === "quiz"){
      var q = activeItem.quiz;
      html =
        '<div class="kicker"><span class="tag">確認クイズ</span><span class="sub-tag">3択 ・ 1問</span></div>' +
        '<p class="q-text">' + esc(q.q) + '</p>' +
        '<div class="options" id="quizOptions">' +
          quizOption(0,"1",q.options[0]) +
          quizOption(1,"2",q.options[1]) +
          quizOption(2,"3",q.options[2]) +
        '</div>' +
        '<div class="quiz-result" id="quizResult" role="status"></div>' +
        '<div class="card-foot"><span>選ぶと、その場で答え合わせ</span></div>';
    }
    else if (c.type === "done"){
      html =
        '<div class="done-wrap">' +
        '<div class="done-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5.2 5L20 6.5" stroke="#101c31" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<h2 class="done-title">' + esc(activeItem.no) + ' ' + esc(activeItem.theme) + '<br>読了</h2>' +
        '<p class="done-sub">' + (quizAnswered ? (quizCorrect ? 'クイズは正解でした' : 'クイズの解説もあわせて確認しました') : '') + '</p>' +
        '<button class="btn btn-restart" id="restartBtn" type="button">最初に戻る</button>' +
        '<button class="btn btn-tolist" id="toListBtn" type="button">一覧に戻る</button>' +
        '</div>';
    }

    cardEl.innerHTML = html;
    cardEl.classList.toggle("quiz-answered", c.type === "quiz" && quizAnswered);
    cardEl.classList.remove("anim-next","anim-prev");
    if (dir === "next") cardEl.classList.add("anim-next");
    if (dir === "prev") cardEl.classList.add("anim-prev");

    curNum.textContent = String(current + 1);
    phaseLabel.textContent = c.phase + (c.type==="expl" ? " " + c.idx + "/" + c.total : "");
    barFill.style.width = ((current + 1) / TOTAL * 100) + "%";
    barWrap.setAttribute("aria-valuenow", String(current + 1));

    var isDone = c.type === "done";
    navRow.style.display = isDone ? "none" : "flex";
    prevBtn.disabled = current === 0;
    if (c.type === "quiz"){
      nextBtn.textContent = "読了へ →";
      nextBtn.disabled = !quizAnswered;
    } else if (current === 0){
      nextBtn.textContent = "物語をはじめる →";
      nextBtn.disabled = false;
    } else {
      nextBtn.textContent = "次へ →";
      nextBtn.disabled = false;
    }

    if (c.type === "quiz") bindQuiz();
    if (c.type === "done"){
      var pgWasRead = isRead(activeItem);
      markRead(activeItem);
      if (window.PGTrack){
        PGTrack.send({site:"心理学", kind:"読了", itemId: activeItem.no, itemName: activeItem.theme});
        if (quizAnswered) PGTrack.send({site:"心理学", kind:"クイズ", itemId: activeItem.no, itemName: activeItem.theme, score: quizCorrect ? 1 : 0});
      }
      var rb = document.getElementById("restartBtn");
      if (rb) rb.addEventListener("click", function(e){ e.stopPropagation(); goTo(0, "prev"); });
      var lb = document.getElementById("toListBtn");
      if (lb) lb.addEventListener("click", function(e){ e.stopPropagation(); showHub(); });
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function quizOption(i, num, label){
    var cls = "opt";
    var disabled = "";
    if (quizAnswered){
      disabled = " disabled";
      if (i === activeItem.quiz.correct) cls += " correct";
      else if (i === quizPicked) cls += " wrong";
      else cls += " dim";
    }
    return '<button type="button" class="'+cls+'" data-i="'+i+'"'+disabled+'><span class="num">'+num+'</span><span>'+esc(label)+'</span></button>';
  }

  function bindQuiz(){
    var box = document.getElementById("quizOptions");
    var result = document.getElementById("quizResult");
    var q = activeItem.quiz;
    var correctLabel = q.options[q.correct];
    var circled = ["①","②","③"][q.correct];
    if (quizAnswered && result){
      result.className = "quiz-result show " + (quizCorrect ? "ok" : "ng");
      result.innerHTML = '<div class="r-head">' + (quizCorrect ? "正解 ― " + circled + " " + esc(correctLabel) : "正解は " + circled + " ― " + esc(correctLabel)) + '</div>' +
        esc(q.resultText);
    }
    if (!box) return;
    var btns = box.querySelectorAll(".opt");
    for (var k=0;k<btns.length;k++){
      btns[k].addEventListener("click", function(e){
        e.stopPropagation();
        if (quizAnswered) return;
        var i = parseInt(this.getAttribute("data-i"), 10);
        quizPicked = i;
        quizAnswered = true;
        quizCorrect = (i === activeItem.quiz.correct);
        render();
      });
    }
  }

  function canNext(){
    if (!activeItem) return false;
    var c = activeItem.cards[current];
    if (c.type === "quiz" && !quizAnswered) return false;
    return current < activeItem.cards.length - 1;
  }
  function goNext(){ if (canNext()){ current++; render("next"); } }
  function goPrev(){ if (activeItem && current > 0){ current--; render("prev"); } }
  function goTo(i, dir){ current = i; render(dir || ""); }

  backBtn.addEventListener("click", function(){ showHub(); });
  prevBtn.addEventListener("click", function(e){ e.stopPropagation(); goPrev(); });
  nextBtn.addEventListener("click", function(e){ e.stopPropagation(); goNext(); });

  cardEl.addEventListener("click", function(e){
    if (!activeItem) return;
    if (e.target.closest("button")) return;
    var c = activeItem.cards[current];
    if (c.type === "done") return;
    if (c.type === "quiz") return;
    var rect = cardEl.getBoundingClientRect();
    var x = e.clientX - rect.left;
    if (x < rect.width * 0.22) goPrev(); else goNext();
  });

  var touchX = null, touchY = null;
  cardEl.addEventListener("touchstart", function(e){
    if (e.touches.length === 1){ touchX = e.touches[0].clientX; touchY = e.touches[0].clientY; }
  }, { passive:true });
  cardEl.addEventListener("touchend", function(e){
    if (touchX === null) return;
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.4){
      if (dx < 0) goNext(); else goPrev();
    }
    touchX = null; touchY = null;
  }, { passive:true });

  /* 誤ダブルタップ／ダブルクリックでの拡大防止（補助）。
     viewport と touch-action が効かない環境向けの保険。
     ボタン類は対象外にし、連打での回答・ページ送りを妨げない */
  document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive:false });
  var lastTouchEnd = 0;
  document.addEventListener("touchend", function(e){
    if (e.target.closest && e.target.closest("button")) return;
    var now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });

  document.addEventListener("keydown", function(e){
    if (!activeItem) return;
    if (e.key === "ArrowRight") goNext();
    if (e.key === "ArrowLeft") goPrev();
    if (e.key === "Escape") showHub();
  });

  showHub();
})();
</script>

<script>
/* PRO-GRAV 学習記録＋会員ゲート（LINEログイン連携） */
(function(){
  var API = 'https://prograv-learn.sprout-and.workers.dev';
  var TARGET = 'psych';
  try {
    var lt = new URLSearchParams(location.hash.slice(1)).get('lt');
    if (lt) { localStorage.setItem('prograv_lt', lt); history.replaceState(null, '', location.pathname + location.search); }
  } catch(e){}
  function pgToken(){ try { return localStorage.getItem('prograv_lt') || ''; } catch(e){ return ''; } }
  window.PGTrack = {
    send: function(ev){
      var t = pgToken(); if (!t) return;
      try { fetch(API + '/api/progress', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t }, body: JSON.stringify(ev) }).catch(function(){}); } catch(e){}
    }
  };
  var startUrl = API + '/auth/start?target=' + TARGET;
  function showGate(msg){
    if (document.getElementById('pgGate')) return;
    var g = document.createElement('div');
    g.id = 'pgGate';
    g.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#101c31;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;visibility:visible';
    g.innerHTML = '<div style="max-width:340px;text-align:center">'
      + '<div style="font-size:20px;letter-spacing:.15em;margin-bottom:14px">PRO-GRAV</div>'
      + '<p style="font-size:14px;line-height:1.8;margin:0 0 8px">この教材は会員専用です</p>'
      + '<p style="font-size:12px;line-height:1.8;opacity:.85;margin:0 0 20px">' + msg + '</p>'
      + '<a href="' + startUrl + '" style="display:block;background:#06C755;color:#fff;font-weight:bold;font-size:15px;padding:13px 10px;border-radius:10px;text-decoration:none">LINEでログイン</a>'
      + '</div>';
    document.body.appendChild(g);
  }
  function showMemberName(r){
    var label = (r.surname || (r.name || '').split(/[\s　]/)[0] || '');
    if (!label) return;
    var host = document.querySelector('.g-head-in');
    if (!host || document.getElementById('pgMemberName')) return;
    var el = document.createElement('span');
    el.id = 'pgMemberName';
    el.style.cssText = 'margin-left:auto;font-size:12px;color:var(--ink);border:1px solid #b9975b;border-radius:999px;padding:3px 10px;white-space:nowrap';
    el.textContent = label + 'さん';
    host.appendChild(el);
  }
  var homeBtn = document.getElementById('pgHomeBtn');
  if (homeBtn) homeBtn.addEventListener('click', function(){
    var deck = document.getElementById('deckView');
    var back = document.getElementById('backBtn');
    if (deck && !deck.hidden && back) back.click();
    window.scrollTo(0, 0);
  });
  var t = pgToken();
  if (!t) { showGate('学習の記録のため、LINEログインをお願いしています'); return; }
  fetch(API + '/api/me', { headers: { 'Authorization': 'Bearer ' + t } })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (j && j.result) {
        document.documentElement.classList.remove('pg-locked');
        showMemberName(j.result);
      } else {
        try { localStorage.removeItem('prograv_lt'); } catch(e){}
        showGate('ログインの有効期限が切れています。再度ログインをお願いします');
      }
    })
    .catch(function(){ showGate('通信エラーが発生しました。電波の良い場所でもう一度開いてください'); });
})();
</script>
